name: core 14

on: [ push, pull_request ]

jobs:
  tests:
    name: TYPO3 14 / PHP ${{ matrix.php }} / ${{ matrix.composerInstall }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
        composerInstall: [ 'composerInstallLowest', 'composerInstallHighest' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install testing system
        run: Build/Scripts/runTests.sh -t 14 -p ${{ matrix.php }} -s ${{ matrix.composerInstall }}

      - name: Lint PHP
        run: Build/Scripts/runTests.sh -t 14 -p ${{ matrix.php }} -s lint

      - name: Validate code against CGL
        run: PHP_CS_FIXER_IGNORE_ENV=1 Build/Scripts/runTests.sh -t 14 -p 8.4 -s cgl -n

      - name: Static analysis
        run: Build/Scripts/runTests.sh -t 14 -p ${{ matrix.php }} -s phpstan

      - name: Unit tests
        run: Build/Scripts/runTests.sh -t 14 -p ${{ matrix.php }} -s unit
